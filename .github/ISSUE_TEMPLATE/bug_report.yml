name: Bug report
description: Something on the site is broken, hard to read or inaccessible
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://truenorthexplained.ca/...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: For example "Firefox 150 on Windows" or "Safari on iPhone". Mention a screen reader or zoom level if you use one.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps.
    validations:
      required: true
