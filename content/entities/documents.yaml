  entities: [org:supreme-court]
  sections:
    - n: 5
      title: Who qualifies to be appointed
    - n: 6
      title: At least three judges from Quebec
      summary: At least three judges must come from Quebec's Court of Appeal, its Superior Court or the Quebec bar.

