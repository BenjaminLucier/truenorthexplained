# Documents: constitutional texts and major statutes, with their most-referenced
# sections. Ids: doc:<id>; a section is doc:<id>/s<n> (s92a, s91-24, s33).
#
# Fields (see src/lib/entities.ts):
#   id, name, page (required: the page that explains it, may carry #anchor),
#   short?, aliases?, summary?, url? (the official text), year?, entities? (ids),
#   sections?: list of
#     n (required: the number as written: 33, "92A", "91(24)"), title?, name?
#     (default "section <n>"), short? (default "s. <n>"), summary?, page?
#     (default: the document's page), url? (default: the document's url)
#
# Only facts already stated on the site's pages belong here.

- id: constitution-act-1867
  name: Constitution Act, 1867
  aliases: [British North America Act, BNA Act]
  year: 1867
  summary: The British law that created Canada on July 1, 1867, originally called the British North America Act.
  page: /learn/constitution/constitution-act-1867
  url: https://laws-lois.justice.gc.ca/eng/const/page-1.html
  sections:
    - n: 9
      title: Executive power vested in the King
    - n: 10
      title: The Governor General
      page: /learn/crown/governor-general#the-governor-general
    - n: 11
      title: The King's Privy Council for Canada
      summary: Creates the King's Privy Council for Canada, the body that advises the Crown; cabinet is its active part.
      page: /learn/elections/cabinet-and-pmo#cabinet
    - n: 17
      title: Parliament is the King, the Senate and the House of Commons
      page: /learn/parliament#three-parts-not-two
    - n: 29
      title: Senators retire at 75
      summary: Senators must retire at 75 (since 1965; before that they sat for life).
      page: /learn/parliament/senate#who-sits-there
    - n: 53
      title: Money bills start in the House of Commons
      summary: Bills to spend public money or impose a tax must start in the House of Commons.
      page: /learn/government/the-budget#two-constitutional-rules
      url: https://laws-lois.justice.gc.ca/eng/const/page-2.html
    - n: 54
      title: The royal recommendation
      summary: The House can't pass a bill to spend public money unless the Governor General has first recommended it, so only the government can propose new spending.
      page: /learn/government/the-budget#two-constitutional-rules
      url: https://laws-lois.justice.gc.ca/eng/const/page-2.html
    - n: 55
      title: Royal assent
      page: /learn/crown/reserve-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-2.html
    - n: 58
      title: A Lieutenant Governor for each province
      page: /learn/crown/governor-general#lieutenant-governors
      url: https://laws-lois.justice.gc.ca/eng/const/page-2.html
    - n: 91
      title: Federal powers
      summary: Parliament's power to make laws for the "Peace, Order, and good Government of Canada", with a list of examples.
      page: /learn/federalism/division-of-powers#key-federal-powers-section-91
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 91(24)
      title: '"Indians, and Lands reserved for the Indians"'
      page: /learn/indigenous/indian-act
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 91(27)
      title: Criminal law
      page: /learn/law/criminal-law
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92
      title: Provincial powers
      summary: The list of exclusive provincial powers.
      page: /learn/federalism/division-of-powers#key-provincial-powers-section-92
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92(13)
      title: Property and civil rights
      page: /learn/federalism/division-of-powers#key-provincial-powers-section-92
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92(14)
      title: Administration of justice
      summary: Provincial power to set up and run courts and handle civil procedure; it's why provinces run most courts, police forces and criminal prosecutions.
      page: /learn/law/criminal-law#the-constitutional-split
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92A
      title: Natural resources
      summary: Provincial power over natural resources, added in 1982.
      page: /learn/federalism/division-of-powers#other-sections-that-add-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 93
      title: Education
      page: /learn/federalism/division-of-powers#other-sections-that-add-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 94A
      title: Pensions
      summary: Parliament may make laws about old age pensions, but a provincial law on the subject prevails.
      page: /learn/federalism/division-of-powers#other-sections-that-add-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 95
      title: Agriculture and immigration
      summary: Both Parliament and the provinces can make laws about agriculture and immigration; federal law prevails in a conflict.
      page: /learn/federalism/division-of-powers#other-sections-that-add-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 96
      title: Superior court judges appointed by the Governor General
      page: /learn/law/courts
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 101
      title: A general court of appeal
      summary: Parliament may create a general court of appeal; the legal basis for the Supreme Court of Canada.
      page: /learn/law/supreme-court
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 133
      title: English and French in Parliament, Quebec's legislature and their courts
      url: https://laws-lois.justice.gc.ca/eng/const/page-4.html

- id: constitution-act-1982
  name: Constitution Act, 1982
  year: 1982
  summary: The Act that patriated the Constitution, adding the Charter, s. 35 and the amending formula.
  page: /learn/constitution/patriation-1982
  url: https://laws-lois.justice.gc.ca/eng/const/page-12.html
  sections:
    - n: 35
      title: Aboriginal and treaty rights
      summary: Recognizes and affirms the existing Aboriginal and treaty rights of First Nations, Inuit and Métis.
      page: /learn/indigenous/section-35
    - n: 36
      title: Equalization and regional disparities
      summary: Commits Parliament and the government of Canada to the principle of equalization payments (s. 36(2)).
      page: /learn/federalism/money-and-equalization#equalization
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 38
      title: The general amending procedure ("7/50")
      page: /learn/constitution/amending-formula#who-has-to-agree
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 41
      title: Amendments that need unanimity
      page: /learn/constitution/amending-formula#who-has-to-agree
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 42
      title: Matters that always need the 7/50 procedure
      page: /learn/constitution/amending-formula#who-has-to-agree
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 43
      title: Amendments affecting some but not all provinces
      page: /learn/constitution/amending-formula#who-has-to-agree
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 44
      title: Amendments by Parliament alone
      page: /learn/constitution/amending-formula#who-has-to-agree
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 45
      title: Amendments by a province alone
      page: /learn/constitution/amending-formula#who-has-to-agree
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 47
      title: The Senate can only delay amendments
      summary: If the Senate hasn't passed an amending resolution within 180 days of the House, the House can pass it again and go ahead without the Senate.
      page: /learn/constitution/amending-formula#the-fine-print-that-makes-750-harder
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html
    - n: 52
      title: Supremacy of the Constitution
      page: /learn/constitution
      url: https://laws-lois.justice.gc.ca/eng/const/page-13.html

- id: charter
  name: Canadian Charter of Rights and Freedoms
  short: the Charter
  aliases: [Charter of Rights and Freedoms, the Charter]
  year: 1982
  summary: Part I of the Constitution Act, 1982 (ss. 1–34), which protects rights against governments.
  page: /learn/charter
  url: https://laws-lois.justice.gc.ca/eng/const/page-12.html
  entities: [doc:constitution-act-1982]
  sections:
    - n: 1
      title: Reasonable limits
      summary: Rights are subject only to limits that are reasonable, prescribed by law and demonstrably justified in a free and democratic society.
      page: /learn/charter/reasonable-limits
    - n: 2
      title: Fundamental freedoms
      page: /learn/charter/your-rights#fundamental-freedoms-s-2
    - n: 3
      title: The right to vote
      summary: Every citizen can vote in federal and provincial elections, and can run for a seat in the House of Commons or a provincial legislature.
      page: /learn/charter/your-rights#democratic-rights-ss-35
    - n: 4
      title: At most five years between elections
      summary: The House of Commons and each provincial legislature can't go more than five years without an election, except in real or feared war, invasion or insurrection.
      page: /learn/charter/your-rights#democratic-rights-ss-35
    - n: 6
      title: Mobility rights
      page: /learn/charter/your-rights#mobility-rights-s-6
    - n: 7
      title: Life, liberty and security of the person
      page: /learn/charter/your-rights#legal-rights-ss-714
    - n: 8
      title: Unreasonable search or seizure
      page: /learn/charter/your-rights#legal-rights-ss-714
    - n: 9
      title: Arbitrary detention or imprisonment
      page: /learn/charter/your-rights#legal-rights-ss-714
    - n: 10
      title: Rights on arrest or detention
      page: /learn/charter/your-rights#legal-rights-ss-714
    - n: 11
      title: Rights of anyone charged with an offence
      summary: Rights of anyone charged with an offence, including to be tried within a reasonable time (s. 11(b)) and to be presumed innocent (s. 11(d)).
      page: /learn/charter/your-rights#legal-rights-ss-714
    - n: 12
      title: Cruel and unusual treatment or punishment
      page: /learn/charter/your-rights#legal-rights-ss-714
    - n: 15
      title: Equality rights
      page: /learn/charter/your-rights#equality-rights-s-15
    - n: 16
      title: Official languages of Canada and New Brunswick
      summary: English and French are the official languages of Canada and of New Brunswick, with equal status in their institutions.
      page: /learn/charter/your-rights#official-languages-ss-1622
    - n: "16.1"
      title: New Brunswick's English and French communities
      summary: The English-speaking and French-speaking communities of New Brunswick have equal status; added in 1993.
      page: /learn/charter/your-rights#official-languages-ss-1622
    - n: 23
      title: Minority language education rights
      page: /learn/charter/your-rights#minority-language-education-rights-s-23
    - n: 24
      title: Remedies
      summary: Courts can give remedies for breaches of the Charter, and can exclude evidence obtained in breach of it.
      page: /learn/charter/your-rights#the-rest-of-the-charter
    - n: 25
      title: Aboriginal rights not reduced
      summary: The Charter doesn't reduce Aboriginal, treaty or other rights of Aboriginal peoples, including those recognized by the Royal Proclamation of 1763.
      page: /learn/charter/your-rights#the-rest-of-the-charter
    - n: 32
      title: Application of the Charter
      summary: The Charter applies to Parliament, the provincial legislatures and governments.
      page: /learn/charter#who-it-binds-governments-only
    - n: 33
      title: Notwithstanding clause
      summary: Lets Parliament or a provincial legislature declare that a law operates despite s. 2, ss. 7–14 or s. 15.
      page: /learn/charter/notwithstanding-clause

- id: statute-of-westminster-1931
  name: Statute of Westminster, 1931
  year: 1931
  summary: The British law that ended Britain's power to legislate for Canada without its consent, but left the BNA Acts out.
