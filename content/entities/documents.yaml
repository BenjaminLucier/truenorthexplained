      title: Royal assent
      page: /learn/crown/reserve-powers
    - n: 91
      title: Federal powers
      summary: Parliament's power to make laws for the "Peace, Order, and good Government of Canada", with a list of examples.
      page: /learn/federalism/division-of-powers#key-federal-powers-section-91
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 91(24)
      title: '"Indians, and Lands reserved for the Indians"'
      page: /learn/indigenous/indian-act
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 91(27)
      title: Criminal law
      page: /learn/law/criminal-law
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92
      title: Provincial powers
      summary: The list of exclusive provincial powers.
      page: /learn/federalism/division-of-powers#key-provincial-powers-section-92
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92(13)
      title: Property and civil rights
      page: /learn/federalism/division-of-powers#key-provincial-powers-section-92
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 92A
      title: Natural resources
      summary: Provincial power over natural resources, added in 1982.
      page: /learn/federalism/division-of-powers#other-sections-that-add-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 93
      title: Education
      page: /learn/federalism/division-of-powers#other-sections-that-add-powers
      url: https://laws-lois.justice.gc.ca/eng/const/page-3.html
    - n: 96
      title: Superior court judges appointed by the Governor General
