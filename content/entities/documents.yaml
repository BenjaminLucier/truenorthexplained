# Documents: constitutional texts and major statutes, with their most-referenced
# sections. Ids: doc:<id>; a section is doc:<id>/s<n> (s92a, s91-24, s33).
#
# Fields (see src/lib/entities.ts):
#   id, name, page (required: the page that explains it, may carry #anchor),
#   short?, aliases?, summary?, url? (the official text), year?, entities? (ids),
#   sections?: list of
#     n (required: the number as written: 33, "92A", "91(24)"), title?, name?
#     (default "section <n>"), short? (default "s. <n>"), summary?, page?
#     (default: the document's page), url? (default: the document's url)
#
# Only facts already stated on the site's pages belong here.

- id: constitution-act-1867
  name: Constitution Act, 1867
  aliases: [British North America Act, BNA Act]
  year: 1867
  summary: The British law that created Canada on July 1, 1867, originally called the British North America Act.
