# Cases explained on other pages (each sets `page`, so they don't appear on
# the landmark-cases timeline). Names, holdings and citations come from the
# pages and glossary entries that discuss them.

- id: persons-case
  name: Persons Case
  aliases: [Edwards v. Canada (Attorney General), Edwards v. Attorney-General for Canada]
  year: 1929
  # Citation as the Supreme Court cites it in Reference re Same-Sex Marriage, 2004 SCC 79
  # (decisions.scc-csc.ca item 2196); decided October 18, 1929 (Women and Gender Equality
  # Canada, "Persons Day"). The Privy Council's own text (BAILII) is blocked to automated fetch.
  citation: "[1930] A.C. 124 (P.C.)"
  topic: women as "persons"
  holding: Women are "persons" who can be appointed to the Senate; the Constitution is "a living tree"
  page: /learn/constitution/constitution-act-1867#a-living-tree
  entities: [term:persons-case, term:living-tree, org:judicial-committee-of-the-privy-council, org:senate]

- id: re-eskimo-1939
  name: 1939 Inuit reference
  aliases: [Re Eskimo]
  year: 1939
  # Formal name: Reference as to whether "Indians" in s. 91(24) of the B.N.A. Act includes
  # Eskimo inhabitants of the Province of Quebec. Citation as given in Daniels, 2016 SCC 12,
  # para. 39 (decisions.scc-csc.ca item 15858); the 1939 decision itself isn't online there.
  citation: "[1939] S.C.R. 104"
  sections: [doc:constitution-act-1867/s91-24]
  holding: Inuit are "Indians" under federal power in s. 91(24)
  page: /learn/indigenous/section-35#the-key-cases
  entities: [term:inuit, org:supreme-court]

- id: calder
  name: Calder
  aliases: [Calder v. British Columbia (Attorney General), Calder et al. v. Attorney-General of British Columbia]
  year: 1973
  citation: "[1973] S.C.R. 313"
  url: https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/5113/index.do
  topic: Aboriginal title exists
  holding: Aboriginal title exists in Canadian law, which pushed Ottawa to start negotiating modern treaties
  page: /learn/indigenous/section-35#the-key-cases
  entities: [term:calder, term:aboriginal-title]

- id: patriation-reference
  name: Patriation Reference
  aliases: [Re Resolution to amend the Constitution]
  year: 1981
  citation: "[1981] 1 S.C.R. 753"
  url: https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/2519/index.do
  topic: patriation without the provinces
  holding: Unilateral patriation would be legal but break a constitutional convention requiring a "substantial degree" of provincial consent
  page: /learn/constitution/patriation-1982#198081-the-push-and-the-court-case
  entities: [term:patriation-reference, term:constitutional-convention, org:supreme-court]

- id: quebec-veto-reference
  name: Quebec Veto Reference
  aliases: [Re Objection by Quebec to a Resolution to amend the Constitution]
  year: 1982
  citation: "[1982] 2 S.C.R. 793"
  url: https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/5530/index.do
  topic: Quebec's veto
  holding: Quebec had no veto over patriation by convention, so the Constitution Act, 1982 applies in Quebec
  page: /learn/constitution/patriation-1982#1982-the-canada-act
  entities: [term:quebec-veto-reference, org:supreme-court]

