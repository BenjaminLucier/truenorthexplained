# Court cases. Id: case:<id>.
#
# Fields (see src/lib/entities.ts):
#   id, name (as usually written, e.g. "R. v. Oakes"), year (required),
#   holding (required: one line, inline markdown, what the court decided),
#   citation? ("[1986] 1 S.C.R. 103"), sections? (doc or section ids it turns on),
#   tag? (free text label, as in the landmark-cases table: "s. 1, s. 11(d)"),
#   topic? (short subject, as in the landmark-cases headings),
#   short?, aliases?, summary?, url? (the decision), people?, entities?,
#   page? (home; default /learn/charter/landmark-cases#<id>)
#
# The landmark-cases headings don't carry {#<id>} anchors yet, so each case
# here names its current heading anchor in `page`. Once that page gives each
# heading an explicit {#<id>}, `page` can go.
# Only facts already stated on the site's pages belong here.

- id: r-v-big-m-drug-mart
  name: R. v. Big M Drug Mart
  aliases: [R. v. Big M Drug Mart Ltd., Big M Drug Mart]
  year: 1985
  citation: "[1985] 1 S.C.R. 295"
  url: https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/43/index.do
  sections: [doc:charter/s2]
  tag: s. 2(a) religion
  topic: freedom of religion
  holding: A law forcing Sunday closing for religious reasons was struck down
  page: /learn/charter/landmark-cases#r-v-big-m-drug-mart-ltd-1985-freedom-of-religion

