# People. Most people are derived, never copied, from
#   src/data/wikidata/{prime-ministers,governors-general,monarchs,chief-justices,premiers}.json
# with id person:<slug of their name> (slugify in src/lib/ids.ts) and home on
# the list page for their highest office (/prime-ministers#pm-N,
# /governors-general#gg-N, #monarch-N, #cj-N, or /provinces/<slug> for premiers).
#
# This file adds two kinds of entry (see src/lib/entities.ts):
#
# 1. Overrides for a derived person, matched by Wikidata `qid`:
#      qid (required), id (their slug; may rename the derived one), name?,
#      short?, aliases?, summary?, page? (replaces the derived home), url?
# 2. People who are in none of those datasets (no `qid`):
#      id, name and page (required), short?, aliases?, summary?, url?
#    Add one only when a page (or a section of one) explains them: that is their
#    home, linked from timeline cards and entity links.
#
# Only facts already stated on the site's pages belong here.

