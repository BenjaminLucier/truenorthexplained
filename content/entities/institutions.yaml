# Institutions and offices. Id: org:<id>.
#
# Fields (see src/lib/entities.ts):
#   id, name, page (required: the page or #anchor that explains it best),
#   short?, aliases?, summary?, url?, people? (person ids), entities? (any ids)
#
# An office (Governor General, Prime Minister) is an org; the people who held
# it are person: entities derived from src/data/wikidata.
# Only facts already stated on the site's pages belong here.

- id: crown
  name: The Crown
  summary: The institution where legal authority comes from, personified by the monarch.
  page: /learn/crown

- id: parliament
  name: Parliament of Canada
  short: Parliament
  summary: Canada's federal law-making body, made up of the King (represented by the Governor General), the Senate and the House of Commons (s. 17).
  page: /learn/parliament
  entities: [doc:constitution-act-1867/s17]

- id: house-of-commons
  name: House of Commons
  short: the House
  summary: The elected chamber of Parliament, with one MP per riding.
  page: /learn/parliament
  url: https://www.ourcommons.ca/members/en

- id: senate
  name: Senate
  aliases: [Senate of Canada]
  summary: Parliament's appointed upper house, whose seats are divided by region.
  page: /learn/parliament/senate
  url: https://sencanada.ca/en/about/

- id: governor-general
  name: Governor General
  aliases: [Governor General of Canada]
  summary: The King's representative at the federal level.
  page: /learn/crown/governor-general#the-governor-general
  url: https://www.gg.ca/en/governor-general/role-and-responsibilities

- id: prime-minister
  name: Prime Minister
  aliases: [Prime Minister of Canada]
  summary: The head of government; the office isn't created anywhere in the Constitution Act, 1867 and exists by convention.
  page: /learn/elections/cabinet-and-pmo#how-much-power-does-the-pm-have

- id: cabinet
  name: Cabinet
  summary: The Prime Minister and the ministers they choose; the government's main decision-making body.
  page: /learn/elections/cabinet-and-pmo#cabinet

- id: pmo
  name: Prime Minister's Office
  short: PMO
  summary: The Prime Minister's own partisan political staff.
  page: /learn/elections/cabinet-and-pmo#the-prime-ministers-office-pmo

- id: pco
  name: Privy Council Office
  short: PCO
  summary: The Prime Minister's non-partisan public service department, led by the Clerk of the Privy Council.
  page: /learn/elections/cabinet-and-pmo#the-privy-council-office-pco
  url: https://www.canada.ca/en/privy-council.html

- id: supreme-court
  name: Supreme Court of Canada
  short: the Supreme Court
  summary: Canada's final court of appeal, with nine judges, at least three from Quebec.
  page: /learn/law/supreme-court
  entities: [doc:constitution-act-1867/s101]

- id: bank-of-canada
  name: Bank of Canada
  summary: Canada's central bank, a special federal Crown corporation.
  page: /learn/government/bank-of-canada-vs-mint#what-the-bank-of-canada-does
  url: https://www.bankofcanada.ca/about/

- id: royal-canadian-mint
  name: Royal Canadian Mint
  short: the Mint
  summary: The Crown corporation that manufactures Canada's coins.
  page: /learn/government/bank-of-canada-vs-mint#what-the-mint-does
  url: https://www.mint.ca/

- id: elections-canada
  name: Elections Canada
  summary: The independent, non-partisan agency that runs federal elections, headed by the Chief Electoral Officer.
  page: /learn/elections/election-day#elections-canada

- id: auditor-general
  name: Auditor General of Canada
  short: Auditor General
  summary: The officer of Parliament who audits the federal government's finances and programs.
  page: /learn/government/watchdogs#the-auditor-general
  url: https://www.canada.ca/en/auditor-general/

- id: parliamentary-budget-officer
  # check: "officer of Parliament"; unresolved 2026-11-13: pbo-dpb.ca says "agent of Parliament" and the Parliament of Canada Act (s. 79.01) says "independent and non-partisan"; label not found in a fetched source
  name: Parliamentary Budget Officer
  short: PBO
  summary: The officer of Parliament who gives MPs and senators independent analysis of the economy and the government's finances.
  page: /learn/government/watchdogs#the-parliamentary-budget-officer

- id: privy-council
  name: King's Privy Council for Canada
  short: the Privy Council
  aliases: [Privy Council]
  summary: The advisory body created by s. 11 of the 1867 Act; ministers join it for life, and cabinet is its active part.
  page: /learn/elections/cabinet-and-pmo#cabinet
  entities: [doc:constitution-act-1867/s11, term:privy-council]

- id: treasury-board
  name: Treasury Board
  summary: A cabinet committee, set up by law and supported by its Secretariat (TBS), that acts as the government's management board.
  page: /learn/government/departments#the-centre-of-government
  entities: [term:treasury-board]

- id: lieutenant-governor
  name: Lieutenant Governor
  summary: The King's representative in a province, appointed by the Governor General on the federal government's advice.
  page: /learn/crown/governor-general#lieutenant-governors
  entities: [doc:constitution-act-1867/s58, term:lieutenant-governor]

- id: judicial-committee-of-the-privy-council
  name: Judicial Committee of the Privy Council
  summary: A court in London that was Canada's final court of appeal until 1949; criminal appeals to it ended in 1933.
  page: /learn/law/supreme-court#a-short-history
  entities: [term:judicial-committee-of-the-privy-council]

- id: federal-court
  name: Federal Court
  summary: A court created by Parliament for areas it assigns, such as immigration and refugee decisions and reviews of federal tribunals.
  page: /learn/law/courts#the-federal-courts
  entities: [term:federal-court]

- id: canadian-judicial-council
  name: Canadian Judicial Council
  summary: A body of the chief justices and associate chief justices of the federally appointed courts that investigates complaints about federally appointed judges.
  page: /learn/law/judges#retirement-and-removal
  entities: [term:canadian-judicial-council]

- id: national-assembly
  name: National Assembly of Quebec
  short: the National Assembly
  aliases: [National Assembly]
  summary: Quebec's legislature, the only one in Canada with that name; it was called the Legislative Assembly until 1968.
  page: /provinces/quebec#how-its-governed
  entities: [term:national-assembly]

- id: council-of-the-federation
  name: Council of the Federation
  summary: The body through which the premiers meet on their own, created in 2003.
  page: /learn/federalism#cooperation-in-practice
  entities: [term:council-of-the-federation]

- id: truth-and-reconciliation-commission
  name: Truth and Reconciliation Commission
  short: TRC
  summary: The commission, created in 2008, that documented the history of residential schools and in 2015 issued 94 Calls to Action.
  page: /learn/indigenous/indian-act#residential-schools-briefly
  entities: [term:truth-and-reconciliation-commission]

- id: rcmp
  name: Royal Canadian Mounted Police
  short: RCMP
  summary: The federal police force, which every province except Ontario and Quebec, and all three territories, pay to act as their provincial or territorial police.
  url: https://rcmp.ca/en/contract-policing/about
  page: /learn/law/criminal-law#who-does-what-step-by-step
  entities: [term:rcmp]

- id: commissioner-of-official-languages
  name: Commissioner of Official Languages
  summary: The federal officer of Parliament who oversees compliance with the Official Languages Act.
  page: /learn/government/watchdogs#the-nine-officers
  entities: [term:commissioner-of-official-languages]

- id: ethics-commissioner
  name: Conflict of Interest and Ethics Commissioner
  summary: The officer of Parliament who administers the Conflict of Interest Act for ministers and senior appointees and the Conflict of Interest Code for MPs.
  page: /learn/government/watchdogs#ethics
  entities: [term:conflict-of-interest-and-ethics-commissioner]
