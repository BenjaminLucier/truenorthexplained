# Question bank: Government in action
# Format: see SITEMAP.md, section "Quizzes".

- id: government-public-service-neutral
  pages: [learn/government, learn/government/departments]
  tags: [public-service]
  type: true-false
  question: When a new party wins an election, most senior federal public servants are replaced with the new party's supporters.
  answer: false
  explanation: >
    Federal public servants, including deputy ministers, are non-partisan and stay
    when the government changes. Appointments are based on merit under the Public
    Service Employment Act. Only ministers' political staff leave with them.
  source: https://laws-lois.justice.gc.ca/eng/acts/P-33.01/

- id: government-minister-vs-deputy
  pages: [learn/government, learn/government/departments]
  tags: [public-service]
  type: single
  question: Who answers to Parliament for what a federal department does?
  options:
    - The deputy minister
    - The minister
    - The Clerk of the Privy Council
    - The Auditor General
  answer: 1
  explanation: >
    Under ministerial responsibility, the minister is accountable to Parliament for the
    department. The deputy minister is the senior public servant who runs it.
  source: https://www.ourcommons.ca/procedure/our-procedure/

- id: government-deputy-appointment
  pages: [learn/government/departments]
  tags: [public-service]
  type: single
  question: How is a federal deputy minister chosen?
  options:
    - Elected by the department's employees
    - Chosen by the minister from among their political staff
    - Appointed by the Governor in Council on the Prime Minister's recommendation
    - Selected by a vote of the House of Commons
  answer: 2
  explanation: >
    Deputy ministers are senior career public servants appointed by the Governor in
    Council on the Prime Minister's recommendation, not by their own minister.
  # check: find a source page that states how deputy ministers are appointed
  source: https://www.canada.ca/en/treasury-board-secretariat/services/reporting-government-spending/inventory-government-organizations/overview-institutional-forms-definitions.html

- id: government-mint-role
  pages: [learn/government, learn/government/bank-of-canada-vs-mint]
  tags: [money]
  type: single
  question: What does the Royal Canadian Mint do?
  options:
    - Sets interest rates
    - Issues banknotes
    - Produces coins, including circulation, collector and bullion coins
    - Regulates banks
  answer: 2
  explanation: >
    The Mint is a Crown corporation that makes coins. The Bank of Canada sets the
    policy interest rate and issues banknotes, and OSFI supervises banks.
  source: https://www.mint.ca/en/company

- id: government-boc-policy-rate
  pages: [learn/government/bank-of-canada-vs-mint]
  tags: [money]
  type: single
  question: What is the Bank of Canada's main tool for keeping inflation near its target?
  options:
    - Setting income tax rates
    - Setting the policy interest rate
    - Deciding how many coins the Mint makes
    - Approving the federal budget
  answer: 1
  explanation: >
    The Bank adjusts its policy interest rate, which influences the rates banks
    charge and pay, and through them spending and prices. Taxes and the budget are
    fiscal policy, set by the government and Parliament.
  source: https://www.bankofcanada.ca/core-functions/monetary-policy/inflation-targeting/

- id: government-boc-target
  pages: [learn/government/bank-of-canada-vs-mint]
  tags: [money]
  type: single
  question: Who sets Canada's inflation target?
  options:
    - The Bank of Canada alone
    - The Minister of Finance alone
    - The Bank of Canada and the federal government jointly, every five years
    - Parliament, by an annual vote
  answer: 2
  explanation: >
    The Bank and the government jointly renew the monetary policy framework every five
    years. The Bank then decides independently how to reach the 2% target.
  source: https://www.bankofcanada.ca/core-functions/monetary-policy/inflation-targeting/

- id: government-crown-corp-definition
  pages: [learn/government, learn/government/crown-corporations]
  tags: [crown-corporations]
  type: single
  question: What best describes a federal Crown corporation such as Canada Post?
  options:
    - A government department led directly by a minister
    - A private company that receives government contracts
    - A company wholly owned by the government, run by its own board at arm's length
    - An independent officer of Parliament
  answer: 2
  explanation: >
    Crown corporations are wholly owned by the Crown. They have their own boards and
    mandates set by law, and a responsible minister answers for them in Parliament.
  source: https://www.canada.ca/en/treasury-board-secretariat/services/guidance-crown-corporations/directors-crown-corporations-introductory-guide-roles-responsibilities.html

- id: government-crown-corp-directive
  pages: [learn/government/crown-corporations]
  tags: [crown-corporations]
  type: true-false
  question: When the federal cabinet formally directs a parent Crown corporation to do something, the directive must be tabled in Parliament.
  answer: true
  explanation: >
    Under s. 89 of the Financial Administration Act, directives are rare, require
    consultation with the board, and must be tabled in Parliament, so they're public.
  source: https://www.canada.ca/en/treasury-board-secretariat/services/guidance-crown-corporations/directors-crown-corporations-introductory-guide-roles-responsibilities.html

- id: government-ag-reports-to
  pages: [learn/government, learn/government/watchdogs]
  tags: [watchdogs]
  type: single
  question: To whom does the Auditor General of Canada report?
  options:
    - The Prime Minister
    - The Minister of Finance
    - Parliament
    - The Treasury Board
  answer: 2
  explanation: >
    The Auditor General is an independent officer of Parliament. Appointment requires
    consulting every recognized party and approval by both houses.
  source: https://laws-lois.justice.gc.ca/eng/acts/A-17/

- id: government-ag-term
  pages: [learn/government/watchdogs]
  tags: [watchdogs]
  type: single
  question: Why is the Auditor General appointed for a single ten-year term that can't be renewed?
  options:
    - To match the length of two parliaments
    - So the Auditor General has no reason to please the government in hopes of reappointment
    - Because the Constitution requires it for all officials
    - So each Prime Minister can appoint their own
  answer: 1
  explanation: >
    A long, fixed, non-renewable term, with removal only by both houses, protects the
    Auditor General's independence from the government being audited.
  source: https://laws-lois.justice.gc.ca/eng/acts/A-17/

- id: government-pbo-costing
  pages: [learn/government/watchdogs]
  tags: [watchdogs, elections]
  type: true-false
  question: Before a federal election, political parties can ask the Parliamentary Budget Officer to estimate the cost of their campaign promises.
  answer: true
  explanation: >
    Before a general election, parties and independent MPs can ask the PBO to cost
    their platform proposals.
  source: https://www.pbo-dpb.ca/en/about--a-propos

- id: government-budget-vs-estimates
  pages: [learn/government, learn/government/the-budget]
  tags: [money, parliament]
  type: single
  question: What gives the government legal authority to spend money on most department operations?
  options:
    - The budget speech
    - An appropriation (supply) act passed by Parliament, based on the estimates
    - A decision of the Treasury Board alone
    - The Bank of Canada
  answer: 1
  explanation: >
    The budget is a plan. Voted spending becomes legal when Parliament passes
    appropriation acts based on the Main and Supplementary Estimates. Statutory
    spending is authorized by other laws.
  source: https://www.ourcommons.ca/procedure/procedure-and-practice-3/ch_18_1-e.html

- id: government-money-bills-origin
  pages: [learn/government/the-budget, learn/parliament]
  tags: [money, parliament, constitution]
  type: single
  question: Under section 53 of the Constitution Act, 1867, where must bills to spend public money or impose taxes begin?
  options:
    - In the Senate
    - In the House of Commons
    - In either chamber
    - In cabinet, with no parliamentary vote
  answer: 1
  explanation: >
    Money bills must originate in the elected House of Commons. The Senate must still
    pass them, as with any bill.
  source: https://laws-lois.justice.gc.ca/eng/const/page-2.html

- id: government-royal-recommendation
  pages: [learn/government/the-budget]
  tags: [money, parliament, constitution]
  type: true-false
  question: Any MP can introduce and pass a bill that creates new government spending, as long as a majority of the House supports it.
  answer: false
  explanation: >
    Under s. 54, spending must be recommended by the Governor General, which in
    practice means the government. This royal recommendation means only ministers can
    propose new spending.
  source: https://laws-lois.justice.gc.ca/eng/const/page-2.html
