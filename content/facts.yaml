# Facts that can't be derived from the datasets in src/data.
# Most facts are derived in src/lib/facts.ts; prefer adding a derivation there.
#
#   key:
#     value: 25            # a string, or a number (numbers print with en-CA grouping;
#                          # write years as strings: "2026")
#     asOf: 2026-11-13     # required: when the value was checked (year or ISO date)
#     source: …            # required: where it comes from
#
# Use in markdown as {{key}} (or {{key|raw}} for the bare value). Every entry
# keeps a check comment (the review marker, as in content pages) until someone
# has confirmed it against the source.

