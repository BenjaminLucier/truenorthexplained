# Wikipedia pages fetched by `pnpm grounding --only wikipedia`.
#
# Grouped by topic. Each entry is an English Wikipedia page title exactly as it
# appears in the page's URL (spaces or underscores both work). Redirects are
# resolved through the API, and the file is named after the title it resolves to.
# A title that doesn't exist is reported and skipped, never guessed.
#
# To add a page: add its title under the right topic and re-run the script.
# To drop a page: remove it here; the script deletes its files on the next run.

